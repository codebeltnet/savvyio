name: Service Update

on:
  repository_dispatch:
    types: [codebelt-service-update]
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Triggering source repo name (e.g. cuemon)'
        required: false
        default: ''
      source_version:
        description: 'Version released by source (e.g. 10.3.0)'
        required: false
        default: ''
      dry_run:
        type: boolean
        description: 'Dry run — show changes but do not commit or open PR'
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  service-update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve trigger inputs
        id: trigger
        run: |
          SOURCE="${{ github.event.client_payload.source_repo || github.event.inputs.source_repo }}"
          VERSION="${{ github.event.client_payload.source_version || github.event.inputs.source_version }}"
          echo "source=$SOURCE"   >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine new version for this repo
        id: newver
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          tag_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          stable_tags = []
          for tag in tags:
              match = tag_pattern.fullmatch(tag)
              if match:
                  version = tuple(int(part) for part in match.groups())
                  stable_tags.append((version, tag))

          if not stable_tags:
              print("::error::No stable vMAJOR.MINOR.PATCH Git tag was found.")
              sys.exit(1)

          _, latest_tag = max(stable_tags, key=lambda item: item[0])
          latest_version = latest_tag[1:]
          major, minor, patch = (int(part) for part in latest_version.split("."))
          next_version = f"{major}.{minor}.{patch + 1}"

          with open("CHANGELOG.md", encoding="utf-8") as changelog_file:
              changelog = changelog_file.read()

          heading = re.search(r"(?m)^## \[(\d+\.\d+\.\d+)\] - ([^\r\n]+)[ \t]*$", changelog)
          if not heading:
              print("::error::CHANGELOG.md has no versioned heading to compare with Git tags.")
              sys.exit(1)

          current_version, current_status = heading.groups()
          current_status = current_status.strip()
          if current_status.upper() != "TBD" and not re.fullmatch(r"\d{4}-\d{2}-\d{2}", current_status):
              print(f"::error::Unsupported CHANGELOG.md version status: {current_status}")
              sys.exit(1)

          if current_version == next_version and current_status.upper() == "TBD":
              # Reuse an already pending next release, such as [5.0.13] - TBD.
              new_version = next_version
          elif current_version == latest_version and current_status.upper() != "TBD":
              # The changelog is at the latest released tag; start the next patch release.
              new_version = next_version
          else:
              print(
                  f"::error::CHANGELOG.md starts at {current_version} ({current_status}), "
                  f"but the latest stable Git tag is {latest_tag}. Expected either "
                  f"[{latest_version}] with a release date or [{next_version}] - TBD."
              )
              sys.exit(1)

          branch = f"v{new_version}/service-update"
          print(f"Latest stable Git tag: {latest_tag}")
          print(f"Latest CHANGELOG.md version: {current_version} ({current_status})")
          print(f"Service update version: {new_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"current={current_version}\n")
              output.write(f"new={new_version}\n")
              output.write(f"branch={branch}\n")

      - name: Generate codebelt-aicia token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CODEBELT_AICIA_APP_ID }}
          private-key: ${{ secrets.CODEBELT_AICIA_PRIVATE_KEY }}
          owner: codebeltnet

      - name: Bump NuGet packages
        run: python3 .github/scripts/bump-nuget.py
        env:
          TRIGGER_SOURCE:  ${{ steps.trigger.outputs.source }}
          TRIGGER_VERSION: ${{ steps.trigger.outputs.version }}

      - name: Update PackageReleaseNotes.txt
        run: |
          NEW="${{ steps.newver.outputs.new }}"
          for f in .nuget/*/PackageReleaseNotes.txt; do
            [ -f "$f" ] || continue
            TFM=$(grep -m1 "^Availability:" "$f" | sed 's/Availability: //' || echo ".NET 10, .NET 9 and .NET Standard 2.0")
            ENTRY="Version: ${NEW}\nAvailability: ${TFM}\n\n# ALM\n- CHANGED Dependencies have been upgraded to the latest compatible versions for all supported target frameworks (TFMs)\n\n"
            { printf "$ENTRY"; cat "$f"; } > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Update CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import os, re
          from datetime import date
          new_ver = os.environ['NEW_VERSION']
          today   = date.today().isoformat()
          service_note = "This release also includes a service update focused on package dependencies."
          with open("CHANGELOG.md", encoding="utf-8") as f:
              content = f.read()
          heading = re.search(r"(?m)^## \[(\d+\.\d+\.\d+)\] - (TBD|\d{4}-\d{2}-\d{2})[ \t]*$", content)
          if heading and heading.group(1) == new_ver:
              if heading.group(2) == "TBD":
                  content = content[:heading.start(2)] + today + content[heading.end(2):]
                  heading = re.search(r"(?m)^## \[(\d+\.\d+\.\d+)\] - \d{4}-\d{2}-\d{2}[ \t]*$", content)
              section_end = re.search(r"(?m)^## \[", content[heading.end():])
              end = heading.end() + section_end.start() if section_end else len(content)
              if service_note not in content[heading.end():end]:
                  remainder = content[heading.end():]
                  content = content[:heading.end()] + "\n\n" + service_note + "\n\n" + remainder.lstrip("\r\n")
              print(f"Updated existing CHANGELOG entry for v{new_ver}")
          else:
              entry = f"## [{new_ver}] - {today}\n\nThis is a service update that focuses on package dependencies.\n\n"
              idx = content.find("## [")
              content = (content[:idx] + entry + content[idx:]) if idx != -1 else (content + entry)
              print(f"Added CHANGELOG entry for v{new_ver}")
          with open("CHANGELOG.md", "w", encoding="utf-8") as f:
              f.write(content)
          EOF
        env:
          NEW_VERSION: ${{ steps.newver.outputs.new }}

      # Note: Docker image bumps removed in favor of manual updates
      # The automated selection was picking wrong variants (e.g., mono-* instead of standard)
      # TODO: Move to hosted service for smarter image selection

      - name: Show diff (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: git diff

      - name: Create branch and open PR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NEW="${{ steps.newver.outputs.new }}"
          BRANCH="${{ steps.newver.outputs.branch }}"
          SOURCE="${{ steps.trigger.outputs.source }}"
          SRC_VER="${{ steps.trigger.outputs.version }}"

          git config user.name  "codebelt-aicia[bot]"
          git config user.email "codebelt-aicia[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git diff --cached --quiet && echo "Nothing changed - skipping PR." && exit 0
          git commit -m "V${NEW}/service update"
          git push origin "$BRANCH"

          echo "This is a service update that focuses on package dependencies." > pr_body.txt
          echo "" >> pr_body.txt
          echo "Automated changes:" >> pr_body.txt
          echo "- Codebelt/Cuemon package versions bumped to latest compatible" >> pr_body.txt
          echo "- PackageReleaseNotes.txt updated for v${NEW}" >> pr_body.txt
          echo "- CHANGELOG.md entry added for v${NEW}" >> pr_body.txt
          echo "" >> pr_body.txt
          echo "Note: Third-party packages (Microsoft.Extensions.*, BenchmarkDotNet, etc.) are not auto-updated." >> pr_body.txt
          echo "Use Dependabot or manual updates for those." >> pr_body.txt
          echo "" >> pr_body.txt
          echo "Generated by codebelt-aicia" >> pr_body.txt
          if [ -n "$SOURCE" ] && [ -n "$SRC_VER" ]; then
            echo "Triggered by: ${SOURCE} @ ${SRC_VER}" >> pr_body.txt
          else
            echo "Triggered by: manual workflow dispatch" >> pr_body.txt
          fi

          gh pr create --title "V${NEW}/service update" --body-file pr_body.txt --base main --head "$BRANCH" --assignee gimlichael
